name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy locally on self-hosted runner
        run: |
          cd /opt/apps/pdf-text-extractor
          ./deploy.sh
